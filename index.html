<!DOCTYPE html>
<html data-fused-theme="shell">
<head>
<meta charset="utf-8" />
<meta name="fused-app" />
<meta name="fused-api-version" content="1" />
<meta name="fused-app-id" content="dynamical-weather-viewer-547875c5" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Weather layers</title>
<style>
  /* Tokens follow the shell (light/dark + colour preset); literals are the standalone fallbacks. */
  :root {
    color-scheme: dark;
    --bg: var(--fused-bg, #12151b);
    --text: var(--fused-fg, #e3e7ee);
    --muted: var(--fused-fg-muted, #98a0ad);
    --line: var(--fused-border, #2b313c);
    --accent: var(--fused-accent, #6ea8ff);
    --error: var(--fused-error, #e66767);
    --globe: #d9dee6;          /* clay globe, land */
    --ocean: #b9c1cc;          /* clay globe, sea */
    --ink: #222730;            /* coastlines and isobars on the globe + slices */
    --slice-ink: #0f1319;      /* ink on the slices (over bright colours) */
    --glass: rgba(188, 204, 230, 0.07);
    --glass-smoke: rgba(14, 18, 26, 0.62);
    --edge: #c9d4e6;
    --shadow-a: 0.55;
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --bg: var(--fused-bg, #f3f4f6);
    --text: var(--fused-fg, #1a1f27);
    --muted: var(--fused-fg-muted, #646c78);
    --line: var(--fused-border, #d9dde3);
    --accent: var(--fused-accent, #2a6fd6);
    --error: var(--fused-error, #d03b3b);
    --globe: #f5f6f8;
    --ocean: #e6e9ee;
    --ink: #4a5260;
    --slice-ink: #2b313c;
    --glass: rgba(172, 188, 212, 0.17);
    --glass-smoke: rgba(52, 60, 74, 0.55);
    --edge: #ffffff;
    --shadow-a: 0.2;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; overflow: hidden;
    font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--text);
    background: radial-gradient(120% 90% at 50% 38%, var(--bg) 0%, color-mix(in oklab, var(--bg) 86%, var(--text) 14%) 100%);
    -webkit-font-smoothing: antialiased;
    user-select: none; -webkit-user-select: none;
  }
  #stage { position: fixed; inset: 0; }
  #gl { width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
  #gl.dragging { cursor: grabbing; }

  /* HUD — floating glass cards */
  .hud { position: fixed; z-index: 2; }
  .card {
    background: color-mix(in srgb, var(--bg) 72%, transparent);
    -webkit-backdrop-filter: blur(14px) saturate(1.2); backdrop-filter: blur(14px) saturate(1.2);
    border: 1px solid color-mix(in srgb, var(--text) 9%, transparent);
    border-radius: 14px;
    box-shadow: 0 10px 30px -18px color-mix(in srgb, var(--text) 35%, transparent);
  }
  .hud-top { top: 18px; left: 18px; padding: 12px 16px 11px; max-width: 300px; }
  .hud-top h1 { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: -0.01em; }
  .hud-top .sub { margin-top: 3px; color: var(--muted); font-size: 11.5px; }
  .hud-top .sub b { color: var(--text); font-weight: 500; }

  .hud-layers { top: 92px; left: 18px; width: 236px; padding: 6px; }
  .row {
    display: grid; grid-template-columns: 16px 1fr auto; align-items: center; gap: 10px;
    padding: 7px 9px; border-radius: 9px; cursor: pointer; position: relative;
    transition: background .15s, opacity .2s;
  }
  .row:hover { background: color-mix(in srgb, var(--text) 7%, transparent); }
  .row .sw { width: 16px; height: 16px; border-radius: 5px; border: 1px solid color-mix(in srgb, var(--text) 14%, transparent); }
  .row .name { font-size: 12.5px; }
  .row .meta { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .row.off { opacity: .42; }
  .row.off .sw { filter: grayscale(1); }
  .row .bar { position: absolute; left: 35px; right: 9px; bottom: 3px; height: 2px; border-radius: 2px;
              background: color-mix(in srgb, var(--text) 10%, transparent); overflow: hidden; display: none; }
  .row .bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s; }
  .row.busy .bar { display: block; }
  .row.busy .bar.indet i { width: 35%; animation: slide 1.1s ease-in-out infinite; }
  @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(300%); } }
  .row.error .meta { color: var(--error); }
  .status { padding: 6px 9px 4px; font-size: 11px; color: var(--muted); min-height: 14px; }
  .status.err { color: var(--error); }

  .hud-bottom {
    left: 50%; bottom: 20px; transform: translateX(-50%);
    width: min(760px, calc(100vw - 36px)); padding: 10px 14px 8px;
    display: grid; grid-template-columns: auto 1fr auto; gap: 14px; align-items: center;
  }
  .icon-btn {
    width: 34px; height: 34px; border-radius: 50%; border: 0; cursor: pointer; display: grid; place-items: center;
    background: var(--text); color: var(--bg);
  }
  .icon-btn svg { width: 14px; height: 14px; fill: currentColor; }
  .icon-btn .pause { display: none; }
  .icon-btn.playing .play { display: none; }
  .icon-btn.playing .pause { display: block; }
  .scrub { position: relative; padding-top: 2px; }
  input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 22px; background: transparent; margin: 0; cursor: pointer; }
  input[type=range]::-webkit-slider-runnable-track { height: 3px; border-radius: 3px; background: color-mix(in srgb, var(--text) 18%, transparent); }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; margin-top: -5.5px; border-radius: 50%; background: var(--text);
    border: 2px solid var(--bg); box-shadow: 0 1px 4px rgba(0,0,0,.25); }
  input[type=range]::-moz-range-track { height: 3px; border-radius: 3px; background: color-mix(in srgb, var(--text) 18%, transparent); }
  input[type=range]::-moz-range-thumb { width: 12px; height: 12px; border-radius: 50%; background: var(--text); border: 2px solid var(--bg); }
  .ticks { position: relative; height: 14px; margin: 0 7px; font-size: 10px; color: var(--muted); }
  .ticks span { position: absolute; transform: translateX(-50%); white-space: nowrap; }
  .ticks span::before { content: ""; position: absolute; left: 50%; top: -4px; width: 1px; height: 4px; background: color-mix(in srgb, var(--text) 30%, transparent); }
  .time { font-variant-numeric: tabular-nums; text-align: right; min-width: 168px; line-height: 1.25; }
  .time b { display: block; font-weight: 600; font-size: 13px; }
  .time span { color: var(--muted); font-size: 11px; }

  .hud-tools { right: 18px; top: 18px; padding: 8px 10px; display: flex; flex-direction: column; gap: 8px; width: 176px; }
  .tool { display: grid; grid-template-columns: 52px 1fr; align-items: center; gap: 8px; font-size: 11.5px; color: var(--muted); }
  .tool input[type=range] { height: 18px; }
  .tool input[type=range]::-webkit-slider-thumb { width: 11px; height: 11px; margin-top: -4px; }
  .btns { display: flex; gap: 6px; }
  .tool-btn {
    flex: 1; border: 1px solid color-mix(in srgb, var(--text) 12%, transparent); background: transparent; color: var(--text);
    font: inherit; font-size: 11.5px; padding: 5px 8px; border-radius: 8px; cursor: pointer;
  }
  .tool-btn:hover { background: color-mix(in srgb, var(--text) 7%, transparent); }
  .tool-btn.on { background: var(--text); color: var(--bg); border-color: transparent; }
  .hint { font-size: 10.5px; color: var(--muted); line-height: 1.35; }

  .credit { right: 18px; bottom: 20px; font-size: 10.5px; color: var(--muted); text-align: right; }
  .toast {
    left: 50%; bottom: 96px; transform: translateX(-50%); padding: 7px 12px; font-size: 12px; border-radius: 10px;
    background: var(--text); color: var(--bg); opacity: 0; transition: opacity .25s; pointer-events: none;
  }
  .toast.show { opacity: 1; }

  /* preview placeholder (apps hub cards) */
  .preview { position: fixed; inset: 0; display: grid; place-items: center; }
  .preview svg { width: min(70vw, 70vh); height: auto; }
  .nogl { position: fixed; inset: 0; display: grid; place-items: center; color: var(--muted); padding: 24px; text-align: center; }

  @media (max-width: 760px) {
    .hud-layers { top: auto; bottom: 108px; width: 200px; }
    .hud-tools { display: none; }
    .time { min-width: 0; }
    .ticks { display: none; }
  }
</style>
</head>
<body>
  <div id="stage"><canvas id="gl"></canvas></div>

  <header class="hud card hud-top">
    <h1>Weather layers</h1>
    <div class="sub" id="runLabel">NOAA GFS · dynamical.org</div>
  </header>

  <aside class="hud card hud-layers">
    <div id="rows"></div>
    <div class="status" id="status"></div>
  </aside>

  <div class="hud card hud-tools">
    <label class="tool">Spread <input id="spread" type="range" min="0.4" max="1.8" step="0.05" value="1" /></label>
    <label class="tool">Speed <input id="speed" type="range" min="0.3" max="3" step="0.1" value="1" /></label>
    <div class="btns">
      <button class="tool-btn" id="spin" title="Slowly turn the globe (S)">Spin</button>
      <button class="tool-btn" id="reset" title="Reset the view (R)">Reset</button>
    </div>
    <div class="hint">Drag to orbit · shift-drag to turn the globe · wheel to zoom · space to play · ← → to step</div>
  </div>

  <footer class="hud card hud-bottom">
    <button class="icon-btn" id="play" aria-label="Play">
      <svg class="play" viewBox="0 0 16 16"><path d="M4 2.5v11l9-5.5z"/></svg>
      <svg class="pause" viewBox="0 0 16 16"><path d="M3.5 2.5h3v11h-3zM9.5 2.5h3v11h-3z"/></svg>
    </button>
    <div class="scrub">
      <input id="scrub" type="range" min="0" max="34" step="1" value="0" aria-label="Forecast hour" />
      <div class="ticks" id="ticks"></div>
    </div>
    <div class="time" id="timeLabel"><b>—</b><span>waiting for data</span></div>
  </footer>

  <div class="hud credit">NOAA GFS from dynamical.org · CC BY 4.0</div>
  <div class="hud toast" id="toast"></div>

<script>
(function () {
  'use strict';

  // ----------------------------------------------------------------- preview gate
  function isPreview() {
    if (new URLSearchParams(location.search).get('_preview') === '1') return true;
    try {
      let w = window;
      while (w.parent && w.parent !== w) {
        w = w.parent;
        if (new URLSearchParams(w.location.search).get('_preview') === '1') return true;
      }
    } catch (e) { /* cross-origin ancestor: the climb ends here */ }
    return false;
  }
  if (isPreview()) {
    document.body.innerHTML = `<div class="preview">
      <svg viewBox="0 0 200 160" xmlns="http://www.w3.org/2000/svg">
        <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2a78d6"/><stop offset="1" stop-color="#eb6834"/></linearGradient></defs>
        <g transform="skewY(-14)">
          <rect x="22" y="40" width="64" height="88" rx="4" fill="url(#g)" opacity=".85"/>
          <rect x="48" y="40" width="64" height="88" rx="4" fill="#6da7ec" opacity=".45"/>
          <rect x="100" y="40" width="64" height="88" rx="4" fill="#9ec5f4" opacity=".35" stroke="#fff" stroke-opacity=".6"/>
          <rect x="126" y="40" width="64" height="88" rx="4" fill="#1baf7a" opacity=".35" stroke="#fff" stroke-opacity=".6"/>
        </g>
        <circle cx="96" cy="84" r="30" fill="#f4f5f7" stroke="#c7ccd4"/>
      </svg></div>`;
    return;
  }

  // ----------------------------------------------------------------- helpers
  const $ = (s) => document.querySelector(s);
  const P = window.fused && window.fused.params;
  const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
  const num = (key, def, lo, hi) => { const v = parseFloat(P.get(key)); return Number.isFinite(v) ? clamp(v, lo, hi) : def; };
  const DAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  const MONS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  const hh = (d) => String(d.getUTCHours()).padStart(2, '0');
  const fmtDay = (d) => `${DAYS[d.getUTCDay()]} ${d.getUTCDate()} ${MONS[d.getUTCMonth()]}`;
  const isDark = () => document.documentElement.getAttribute('data-theme') !== 'light';
  const cctx = document.createElement('canvas').getContext('2d');
  function cssRgb(token) {
    const raw = getComputedStyle(document.documentElement).getPropertyValue(token).trim();
    cctx.fillStyle = '#000'; cctx.fillStyle = raw;
    const s = cctx.fillStyle;
    if (s[0] === '#') return [parseInt(s.slice(1, 3), 16) / 255, parseInt(s.slice(3, 5), 16) / 255, parseInt(s.slice(5, 7), 16) / 255, 1];
    const m = s.match(/[\d.]+/g) || [0, 0, 0, 1];
    return [m[0] / 255, m[1] / 255, m[2] / 255, m.length > 3 ? +m[3] : 1];
  }
  const hexRgb = (h) => { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };

  if (!P) { document.body.innerHTML = '<div class="nogl">This page needs the fused-render runtime.</div>'; return; }
  const canvas = $('#gl');
  const gl = canvas.getContext('webgl2', { alpha: true, antialias: true, premultipliedAlpha: true, powerPreference: 'high-performance' });
  if (!gl) { document.body.innerHTML = '<div class="nogl">WebGL 2 is needed to draw the layers.</div>'; return; }

  // ----------------------------------------------------------------- palettes (data colours; mode-stepped, never the preset)
  // stops: [position 0..1, hex, alpha]. Sequential = one hue; diverging = two hues + neutral midpoint.
  const PALETTES = {
    temperature: (dark) => [[0, '#0d366b', .92], [.18, '#2a78d6', .9], [.36, '#9ec5f4', .86], [.4706, dark ? '#d9d6cf' : '#ebe8e1', .7],
      [.6, '#f6c39d', .86], [.74, '#eb6834', .9], [.88, '#b8252a', .92], [1, '#6b0f1a', .95]],
    wind: () => [[0, '#fbe3d4', 0], [.12, '#fbe3d4', .32], [.35, '#f3a06e', .72], [.6, '#eb6834', .88], [1, '#7a2408', .95]],
    clouds: (dark) => dark
      ? [[0, '#ffffff', 0], [.25, '#dfe5ec', .22], [.55, '#f2f4f7', .66], [1, '#ffffff', .96]]
      : [[0, '#ffffff', 0], [.25, '#e8ecf1', .28], [.55, '#f7f8fa', .72], [1, '#ffffff', .97]],
    precip: () => [[0, '#cde2fb', 0], [.08, '#cde2fb', .38], [.3, '#6da7ec', .82], [.6, '#256abf', .92], [1, '#0d366b', .97]],
    water: () => [[0, '#c8efe0', 0], [.2, '#c8efe0', .2], [.45, '#5fd1a6', .56], [.7, '#1baf7a', .84], [1, '#0a5c3f', .95]],
    pressure: () => [[0, '#2a78d6', .38], [.45, '#9ec5f4', .12], [.608, '#f0efec', 0], [.75, '#f6b89c', .12], [1, '#d03b3b', .38]],
  };
  const PIXELATED = { precip: true };
  const SMOKED = { clouds: true };        // dark glass behind the cloud slice so white reads
  const ISOBARS = { pressure: true };

  function cmapBytes(stops) {
    const out = new Uint8Array(256 * 4);
    for (let i = 0; i < 256; i++) {
      const p = i / 255; let j = 0;
      while (j < stops.length - 2 && stops[j + 1][0] < p) j++;
      const [p0, h0, a0] = stops[j], [p1, h1, a1] = stops[j + 1];
      const t = p1 > p0 ? clamp((p - p0) / (p1 - p0), 0, 1) : 0;
      const c0 = hexRgb(h0), c1 = hexRgb(h1);
      for (let k = 0; k < 3; k++) out[i * 4 + k] = Math.round(c0[k] + (c1[k] - c0[k]) * t);
      out[i * 4 + 3] = Math.round(255 * (a0 + (a1 - a0) * t));
    }
    return out;
  }
  const swatchCss = (stops) => `linear-gradient(90deg, ${stops.map(([p, h, a]) => {
    const [r, g, b] = hexRgb(h); return `rgba(${r},${g},${b},${Math.max(a, .15)}) ${(p * 100).toFixed(0)}%`; }).join(', ')})`;

  // ----------------------------------------------------------------- GL plumbing
  function compile(type, src) {
    const sh = gl.createShader(type); gl.shaderSource(sh, src); gl.compileShader(sh);
    if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) throw new Error('shader: ' + gl.getShaderInfoLog(sh));
    return sh;
  }
  function program(vs, fs) {
    const p = gl.createProgram();
    gl.attachShader(p, compile(gl.VERTEX_SHADER, vs)); gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fs));
    gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error('link: ' + gl.getProgramInfoLog(p));
    const u = {}; const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
    for (let i = 0; i < n; i++) { const info = gl.getActiveUniform(p, i); u[info.name] = gl.getUniformLocation(p, info.name); }
    return { p, u };
  }
  function vao(attribs, index) {
    const v = gl.createVertexArray(); gl.bindVertexArray(v);
    attribs.forEach(({ loc, data, size }) => {
      const b = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, b); gl.bufferData(gl.ARRAY_BUFFER, data, gl.STATIC_DRAW);
      gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, size, gl.FLOAT, false, 0, 0);
    });
    const ib = gl.createBuffer(); gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, ib); gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, index, gl.STATIC_DRAW);
    gl.bindVertexArray(null);
    return { v, count: index.length };
  }

  const VS_GLOBE = `#version 300 es
precision highp float;
in vec3 a_pos;
uniform mat4 u_proj, u_view;
uniform vec2 u_shift;
out vec3 v_pos;
void main(){ v_pos = a_pos; vec4 c = u_proj * u_view * vec4(a_pos, 1.0); c.xy += u_shift * c.w; gl_Position = c; }`;

  const FS_GLOBE = `#version 300 es
precision highp float;
in vec3 v_pos;
uniform sampler2D u_base;
uniform float u_hasBase, u_lon0;
uniform vec3 u_eye, u_globe, u_ocean, u_ink;
out vec4 o;
const float PI = 3.14159265;
void main(){
  vec3 n = normalize(v_pos);
  float lat = asin(clamp(n.y, -1.0, 1.0));
  float lon = atan(n.x, n.z) + u_lon0;
  vec2 uv = vec2(lon / (2.0 * PI) + 0.5, 0.5 - lat / PI);
  vec4 b = u_hasBase > 0.5 ? texture(u_base, uv) : vec4(0.5, 0.0, 0.0, 0.0);
  vec3 col = mix(u_ocean, u_globe, b.b);
  col *= 0.76 + 0.48 * b.r;                 // hillshade, 0.5 = flat
  col *= 1.0 - 0.10 * b.a;                  // high ground a touch darker
  col = mix(col, u_ink, b.g * 0.6);         // coastlines as fine cracks
  vec3 L = normalize(vec3(-0.45, 0.6, 0.72));
  float diff = max(dot(n, L), 0.0);
  vec3 V = normalize(u_eye - v_pos);
  float rim = pow(1.0 - max(dot(n, V), 0.0), 3.0);
  col *= 0.64 + 0.40 * diff;
  col *= 1.0 - 0.2 * rim;
  o = vec4(col, 1.0);
}`;

  const VS_PANE = `#version 300 es
precision highp float;
in vec3 a_pos;
in vec3 a_nrm;
uniform mat4 u_proj, u_view;
uniform vec2 u_shift;
uniform vec3 u_scale;
uniform float u_z;
out vec2 v_xy; out vec3 v_nrm;
void main(){
  vec3 p = a_pos * u_scale + vec3(0.0, 0.0, u_z);
  v_xy = p.xy; v_nrm = a_nrm;
  vec4 c = u_proj * u_view * vec4(p, 1.0); c.xy += u_shift * c.w; gl_Position = c;
}`;

  const FS_PANE = `#version 300 es
precision highp float;
in vec2 v_xy; in vec3 v_nrm;
uniform sampler2D u_fa, u_fb, u_cmap, u_base;
uniform float u_hasBase, u_hasData, u_mix, u_depth16, u_isobars, u_lon0, u_side, u_alpha, u_glow;
uniform vec4 u_glass;
uniform vec3 u_edge, u_ink;
uniform vec2 u_vrange;
out vec4 o;
const float PI = 3.14159265;
float decode(sampler2D s, vec2 uv){
  vec4 t = texture(s, uv);
  return u_depth16 > 0.5 ? (t.r * 65280.0 + t.g * 255.0) / 65535.0 : t.r;
}
void main(){
  vec3 nrm = normalize(v_nrm);
  vec2 q = v_xy / u_side;
  float edgeDist = min(1.0 - abs(q.x), 1.0 - abs(q.y));
  float edge = 1.0 - smoothstep(0.0, 0.02, edgeDist);
  float streak = exp(-pow((q.x - q.y * 0.55 + 0.45) * 2.4, 2.0)) * 0.09;
  vec3 pc; float pa;
  if (abs(nrm.z) < 0.5) {                       // the slab's thin sides
    pc = u_edge * 0.6; pa = 0.6;
  } else {
    pa = u_glass.a + streak; pc = u_glass.rgb * pa;
    float r2 = dot(v_xy, v_xy);
    float r = sqrt(r2);
    float w = max(fwidth(r) * 1.5, 0.002);
    float disc = 1.0 - smoothstep(1.0 - w, 1.0 + w * 0.5, r);
    if (disc > 0.0 && u_hasData > 0.5) {
      // orthographic view of the hemisphere facing this side of the slab: lines up with the globe behind
      float zz = sqrt(max(1.0 - r2, 0.0)) * sign(nrm.z);
      float lat = asin(clamp(v_xy.y, -1.0, 1.0));
      float lon = atan(v_xy.x, zz) + u_lon0;
      vec2 uv = vec2(lon / (2.0 * PI) + 0.5, 0.5 - lat / PI);
      float v = mix(decode(u_fa, uv), decode(u_fb, uv), u_mix);
      vec4 d = texture(u_cmap, vec2(v, 0.5));
      if (u_isobars > 0.5) {

    run.lead.forEach((h, i) => {
      const d = new Date(run.initMs + h * 3600e3);
      if (d.getUTCHours() === 0 || i === 0) { const s = document.createElement('span'); s.style.left = (i / (run.n - 1) * 100) + '%'; s.textContent = fmtDay(d); t.appendChild(s); }
    });
  }

  $('#scrub').addEventListener('input', (e) => { state.playing = false; state.tf = +e.target.value; setParam('t', +e.target.value); syncTime(); requestRender(); });
  $('#play').addEventListener('click', togglePlay);
  function togglePlay() { if (!state.run) return; state.playing = !state.playing; syncTime(); requestRender(); }
  $('#spread').addEventListener('input', (e) => setParam('spread', +e.target.value));
  $('#speed').addEventListener('input', (e) => { state.speed = +e.target.value; });
  $('#spin').addEventListener('click', () => { if (state.spin) { setParam('lon', +state.lon.toFixed(1)); } P.set('spin', state.spin ? '0' : '1'); });
  $('#reset').addEventListener('click', resetView);
  function resetView() { state.vyaw = state.vpitch = 0; for (const k in DEF) setParam(k, DEF[k]); }
  window.addEventListener('keydown', (e) => {
    if (e.target.tagName === 'INPUT') return;
    if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
    else if (e.key === 'ArrowRight' && state.run) { state.playing = false; setParam('t', (Math.floor(state.tf) + 1) % state.run.n); }
    else if (e.key === 'ArrowLeft' && state.run) { state.playing = false; setParam('t', (Math.floor(state.tf) - 1 + state.run.n) % state.run.n); }
    else if (e.key === 'r') resetView();
    else if (e.key === 's') $('#spin').click();
  });

  // pointer: drag = orbit, shift/right-drag = turn the globe, wheel/pinch = zoom
  const pointers = new Map(); let pinchDist = 0;
  canvas.addEventListener('pointerdown', (e) => {
    canvas.setPointerCapture(e.pointerId); pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    state.dragging = (e.shiftKey || e.button === 2) ? 'spin' : 'orbit'; state.vyaw = state.vpitch = 0; canvas.classList.add('dragging');
    if (pointers.size === 2) { const [a, b] = [...pointers.values()]; pinchDist = Math.hypot(a.x - b.x, a.y - b.y); }
  });
  canvas.addEventListener('pointermove', (e) => {
    const p = pointers.get(e.pointerId); if (!p) return;
    const dx = e.clientX - p.x, dy = e.clientY - p.y; p.x = e.clientX; p.y = e.clientY;
    if (pointers.size === 2) {
      const [a, b] = [...pointers.values()]; const d = Math.hypot(a.x - b.x, a.y - b.y);
      if (pinchDist) state.zoom = clamp(state.zoom * (d / pinchDist), 0.45, 3); pinchDist = d; requestRender(); return;
    }
    if (state.dragging === 'spin') state.lon += dx * 0.35;
    else { state.vyaw = dx * 0.28; state.vpitch = dy * 0.28; state.yaw += state.vyaw; state.pitch = clamp(state.pitch + state.vpitch, -85, 85); }
    requestRender();
  });
  const endDrag = (e) => {
    pointers.delete(e.pointerId); if (pointers.size) return;
    canvas.classList.remove('dragging'); state.dragging = null; pinchDist = 0;
    if (Math.abs(state.vyaw) < 0.4 && Math.abs(state.vpitch) < 0.4) { state.vyaw = state.vpitch = 0; commitView(); }
    else requestRender();
  };
  canvas.addEventListener('pointerup', endDrag); canvas.addEventListener('pointercancel', endDrag);
  canvas.addEventListener('contextmenu', (e) => e.preventDefault());
  canvas.addEventListener('wheel', (e) => {
    e.preventDefault(); state.zoom = clamp(state.zoom * Math.exp(-e.deltaY * 0.0012), 0.45, 3); requestRender();
    clearTimeout(canvas.wheelT); canvas.wheelT = setTimeout(commitView, 250);
  }, { passive: false });
  canvas.addEventListener('dblclick', resetView);
  new ResizeObserver(() => requestRender()).observe($('#stage'));
  new MutationObserver(() => { sceneColors(); requestRender(); }).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme', 'data-fused-theme-name', 'style'] });

  // ----------------------------------------------------------------- data flow
  state.progress = {};
  function setProgress(id, st) { state.progress[id] = st; syncRows(); }

  async function loadLayer(manifest) {
    const id = manifest.layer, urls = manifest.frames.map((p) => fused.rawUrl(p));
    let done = 0;
    setProgress(id, { busy: true, frac: 0, text: 'loading 0/' + urls.length });
    const imgs = await Promise.all(urls.map((u) => loadImage(u).then((im) => { done++; setProgress(id, { busy: true, frac: done / urls.length, text: `loading ${done}/${urls.length}` }); return im; })));
    const frames = imgs.map((im) => texture(im, { nearest: !!PIXELATED[id], depth16: manifest.depth === 16 }));
    const L = { id, manifest, frames, ready: true };
    rebuildCmap(L);
    setProgress(id, null);
    return L;
  }
  function disposeRun(run) { if (!run) return; for (const id in run.layers) { const L = run.layers[id]; L.frames.forEach((t) => gl.deleteTexture(t)); if (L.cmap) gl.deleteTexture(L.cmap); } }
  function makeRun(init_time, lead) {
    return { init_time, initMs: Date.parse(init_time + 'Z'), lead, n: lead.length, layers: {} };
  }
  function showRun(run, announce) {
    const old = state.run; state.run = run;
    buildTicks(run);
    $('#runLabel').innerHTML = `NOAA GFS 0.25° · dynamical.org · run <b>${fmtDay(new Date(run.initMs))} ${hh(new Date(run.initMs))}z</b>`;
    if (old && old !== run) disposeRun(old);
    layoutPanes(); syncRows(); syncTime(); requestRender();
    if (announce) toast(announce);
  }
  async function loadBasemap(manifest) {
    try {
      const im = await loadImage(fused.rawUrl(manifest.path));
      const t = texture(im, { rgba: true }); if (state.basemap) gl.deleteTexture(state.basemap); state.basemap = t; requestRender();
    } catch (e) { console.warn(e); }
  }

  // one-at-a-time-ish queue: each layer is its own ~30 s Python process
  const queue = []; let active = 0; const MAX_ACTIVE = 2;
  function enqueue(job) { return new Promise((res, rej) => { queue.push({ job, res, rej }); pump(); }); }
  function pump() { while (active < MAX_ACTIVE && queue.length) { const { job, res, rej } = queue.shift(); active++; job().then(res, rej).finally(() => { active--; pump(); }); } }

  async function fetchLayer(id, init, target) {
    setProgress(id, { busy: true, frac: null, text: 'fetching…', init, target });
    try {
      const manifest = await enqueue(() => py({ action: 'layer', layer: id, init }, 'layer:' + id));
      const L = await loadLayer(manifest);
      target.layers[id] = L;
      if (state.run === target) { layoutPanes(); requestRender(); }
      return L;
    } catch (e) {
      console.warn('layer ' + id, e);
      setProgress(id, { error: true, init, target });
      throw e;
    }
  }
  function finishProgressive() { syncRows(); }

  async function boot() {
    try { sceneColors(); } catch (e) { console.warn(e); }
    draw();
    let info;
    try { info = await py({ action: 'cached' }, 'cached'); }
    catch (e) { setStatus('Could not start the data helper: ' + (e.message || e), true); throw e; }
    state.order = info.layer_order; state.specs = info.layers; buildRows();
    if (info.basemap) loadBasemap(info.basemap);
    let current = null;
    const cachedRun = info.runs[0];
    if (cachedRun) {
      current = makeRun(cachedRun.init_time, Object.values(cachedRun.layers)[0].lead_hours);
      showRun(current);
      setStatus('Loading cached run…');
      await Promise.all(Object.values(cachedRun.layers).map(async (m) => { current.layers[m.layer] = await loadLayer(m); layoutPanes(); requestRender(); }));
      setStatus('');
    }
    // newest run from dynamical.org, in the background
    setStatus('Checking dynamical.org for the newest run…');
    let latest;
    try { latest = await py({ action: 'latest' }, 'latest'); }
    catch (e) { setStatus(current ? 'Showing the cached run · could not reach dynamical.org' : 'Could not reach dynamical.org: ' + (e.message || e), true); console.warn(e); return; }
    const haveAll = current && current.init_time === latest.init_time && state.order.every((id) => current.layers[id]);
    if (!info.basemap) py({ action: 'basemap' }, 'basemap').then(loadBasemap).catch((e) => console.warn('basemap', e));
    if (haveAll) { setStatus(''); return; }
    const target = current && current.init_time === latest.init_time ? current : makeRun(latest.init_time, latest.layer.lead_hours);
    const progressive = !current || target === current;
    if (!target.layers.temperature) { target.layers.temperature = await loadLayer(latest.layer); }
    if (progressive) { if (!state.run) showRun(target); layoutPanes(); requestRender(); }
    setStatus(progressive ? 'Fetching layers from dynamical.org…' : `Fetching the ${hh(new Date(target.initMs))}z run…`);
    const missing = state.order.filter((id) => !target.layers[id]);
    const results = await Promise.allSettled(missing.map((id) => fetchLayer(id, latest.init_time, target)));
    const failed = results.filter((r) => r.status === 'rejected').length;
    if (!progressive) showRun(target, `Updated to the ${hh(new Date(target.initMs))}z run`);
    setStatus(failed ? `${failed} layer${failed > 1 ? 's' : ''} failed — click to retry` : '', !!failed);
  }

  P.onChange(draw);
  boot().catch((e) => console.error(e));
})();
</script>
</body>
</html>
